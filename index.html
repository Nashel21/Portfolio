<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nigel Chapwanya | Portfolio</title>
        <style>
        body{
            margin:0;
            display:flex;
            margin:0;
            display:flex;
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url("bground.jpg");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            background-attachment:fixed;
            font-family: 'Poppins', sans-serif;
            color:rgb(14, 197, 14);}
        h1, h2, h3 {
            font-family: 'Montserrat', sans-serif;
            text-align:center;}
        a{
            color:#35b393;}
        #sidebar{
            position:fixed;
            top:0;
            left:-300px;
            z-index:1000;
            transition:1s;
            width:150px;
            height:100vh;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(3px);
            padding:20px;
            box-shadow:2px 0 10px rgba(88,166,255,0.5);
            box-sizing:border-box;}
        .menuItem{
            border: solid 1px rgb(6, 138, 6);
            padding:12px;
            cursor:pointer;
            border-radius:8px;
            margin-bottom:10px;
            transition:1s;}
        .menuItem:hover{
            transform:scale(1.05);}
        #menulist{
            list-style:none;
            padding:0;}
        #floatingMenu{
            position:fixed;
            top:20px;
            left:10px;
            z-index:1000;
            background:rgba(255, 255, 255, 0.151);
            backdrop-filter:blur(3px);
            color: rgb(46, 185, 46);
            border:none;
            padding:10px 15px;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;}
        #backdrop{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            z-index:999;}
        #content{
            flex:1;
            text-align: center;
            padding:20px}
        #aboutcontent{
            text-align:center;}
        #prophoto{
            width:50%;
            max-width:350px;
            aspect-ratio:1/1;
            border-radius:50%;
            object-fit:cover;
            box-shadow:0 0 15px rgb(37, 127, 143);}
        #statCards{
            display:flex;
            justify-content:center;
            gap:20px;
            flex-wrap:wrap;
            margin-top:20px;
            margin-bottom:20px;}
        .statCard{
            background:rgba(255,255,255,0.05);
            border:1px solid rgb(88, 166, 255,0.2);
            backdrop-filter:blur(3px);
            padding:10px;
            border-radius:10px;
            transition:1s;
            cursor:pointer;}
        .statCard:hover{
            transform:translateY(-4px);
            box-shadow:0 0 15px rgb(14, 197, 14);}
        .skbar{
            width:80%;
            background:#30363d;
            border-radius:10px;
            overflow:hidden;}
        .progress{
            height:20px;
            background:#318d76;}
        .landscape{
            max-width:120vw;
            max-height:120vh;
            width:auto;
            height:auto;}
        .upright{
            max-width:100vw;
            max-height:100vh;
            width:auto;
            height:auto;
            object-fit:contain;}
        #projectsContainer, #certcontainer{
            display:flex;
            gap:20px;
            flex-wrap:wrap;
            justify-content:center;
            margin-top:20px;}
        .procard, .certcard{
            background:rgba(255,255,255,0.05);
            border:1px solid rgb(88, 166, 255,0.2);
            backdrop-filter:blur(3px);
            padding:20px;
            border-radius:12px;
            width:90%;
            max-width:300px;
            transition:0.3s;
            cursor:pointer;}
        .procard:hover{
            transform:translateY(-8px);
            box-shadow:0 0 20px rgb(14, 197, 14);}
        .certcard:hover{
            transform:translateY(-8px);
            box-shadow:0 0 20px rgb(14, 197, 14);}
        #backBtn{
            position:fixed;
            top:20px;
            left:90%;
            z-index:1000;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(3px);
            color:rgb(46, 185, 46);
            border:none;
            padding:10px;
            border-radius:8px;
            cursor:pointer;}
        #backBtn:hover{
            transform:scale(1.05);}
        .contactCard{
            background:rgba(255,255,255,0.05);
            border:1px solid rgb(88, 166, 255,0.2);
            backdrop-filter:blur(3px);
            border-radius:12px;
            padding:20px;
            width:90%;
            max-width:250px;
            margin:20px auto;
            text-align:center;
            transition:0.3s;
            cursor:pointer;}
        .contactCard:hover{
            transform:translateY(-4px);
            box-shadow:0 0 20px rgba(88,166,255,0.5);}
        .fadeIn{
            animation:fadeIn 0.8s ease;}
        @keyframes fadeIn{
            from{
                opacity:0;
                transform:scale(0.8);
            }to{
                opacity:1;
                transform:scale(1px);
            }}
        </style>   
    </head>
    <body>
        <div id="sidebar">
            <ul id="menulist">
                <li id="homeBtn" class="menuItem">Home</li>
                <li id="aboutBtn" class="menuItem">About Me</li>
                <li id="skillsBtn" class="menuItem">Skills</li>
                <li id="certificatesBtn" class="menuItem">Certificates</li>
                <li id="projectsBtn" class="menuItem">Projects</li>
                <li id="contactBtn" class="menuItem">Contact</li>
            </ul>
        </div>
        <button id="floatingMenu"> ☰ </button>
        <div id="backdrop"></div>
        <div id="content">
            <h1>Welcome to my portfolio</h1>
            <P>This is my personal portfolio, take a tour browsing about my details through the menu on your left.</P>
            <p>Select an item from the menu.</p>
        </div>
        <script>
            let sidebar = document.getElementById("sidebar");
            let floatingMenu = document.getElementById("floatingMenu");
            function setActive(selected){
                let items = document.getElementsByClassName("menuItem");
                for(let i = 0; i < items.length; i++){
                    items[i].style.background = "";
                    items[i].style.color = "white";
                }
                selected.style.background = "rgb(6, 138, 6)";
                selected.style.color = "white";
            }
            function changeContent(contentHTML){
                content.innerHTML = contentHTML;
                content.classList.remove("fadeIn");
                void content.offsetWidth;
                content.classList.add("fadeIn");
            }
            function BackButton(returnTo){
                let backBtn = document.getElementById("backBtn");
                backBtn.addEventListener("click", function(){
                    returnTo.click();
                });
            }
            let content = document.getElementById("content");
            let homecontent = content.innerHTML;
            let home = document.getElementById("homeBtn");
            let about = document.getElementById("aboutBtn");
            let skills = document.getElementById("skillsBtn");
            let certificates = document.getElementById("certificatesBtn");
            let projects = document.getElementById("projectsBtn");
            let contact = document.getElementById("contactBtn");
            let backdrop = document.getElementById("backdrop");
            setActive(home);
            home.addEventListener("click", function(){
                setActive(home);
                changeContent(homecontent);
            });
            about.addEventListener("click", function(){
                setActive(about);
                changeContent(`
                <div id="aboutcontent">
                    <img id="prophoto" src="profile.jpg">
                    <h1>Nigel Njini Chapwanya</h1>
                    <h3>Final-Year BCA Student & Aspiring Software Developer </h3>
                    <div id="statCards">

                    <div class="statCard">
                    🎓 BCA Student
                    </div>

                    <div class="statCard">
                    🏆 Bronze Medal
                    </div>

                    <div class="statCard">
                    💻 Developer
                    </div>

                    <div class="statCard">
                    🌍 Zimbabwe
                    </div>

                    </div>
                    <p>
                        I am Nigel Njini Chapwanya, a final-year Bachelor of Computer Applications (BCA)
                        student at MVN University, expected to graduate in June 2027.
                        I enjoy solving problems through programming and continuously improving my
                        technical skills in Python, C, C++, JavaScript, HTML and SQL.

                        My goal is to gain practical industry experience through internships and
                        software development projects while building a strong foundation for an
                        international career in technology.
                    </p>
                </div>
                `);
            });
            certificates.addEventListener("click", function(){
                setActive(certificates);
                changeContent(`
                <h2>Educational Certificates</h2>
                <div id="certcontainer">
                    <div id="olevel" class="certcard">
                        <h3>O Level Certifcate</h3>
                        <p>Attained at Alheit High School in the year 2021</p>

                        <p>Click to view Certificate</p>
                    </div>

                    <div id="alevel" class="certcard">
                        <h3>A Level Certifcate</h3>
                        <p>Attained at Hippo Valley High School in the year 2023</p>

                        <p>Click to view Certificate</p>
                    </div>

                    <div id="slicecorn" class="certcard">
                        <h3>Slice Corn Certifcate</h3>
                        <p>Attained after attending Slice Corn 2.1 hosted by Edoofa</p>

                        <p>Click to view Certificate</p>
                    </div>
                    
                    <div id="codebegins" class="certcard">
                        <h3>Code Begins Certifcate</h3>
                        <p>Attained after competing in a programing competition hosted by MVN University</p>
                        <p>13 November 2024</p>

                        <p>Click to view Certificate</p>
                    </div>

                    <div id="MLcet" class="certcard">
                        <h3>One day Machine Learning Certifcate</h3>
                        <p>Attained after attending a one day workshop held at MVN University by DUCAT IT Training School</p>
                        <p>16 October 2024</p>

                        <p>Click to view Certificate</p>
                    </div>
                </div>
                `)
                let olevel = document.getElementById("olevel");
                let alevel = document.getElementById("alevel");
                let slicecorn = document.getElementById("slicecorn");
                let codebegins = document.getElementById("codebegins");
                let MLcet = document.getElementById("MLcet");
                olevel.addEventListener("click", function(){
                    changeContent(`
                    <div style="text-align: right;">
                        <button id="backBtn">
                            ← Back
                        </button>
                    </div>
                    <img id="OLevel" class="upright" src="OLevel.jpg">
                    `)
                    BackButton(certificates);
                })
                alevel.addEventListener("click", function(){
                    changeContent(`
                    <div style="text-align: right;">
                        <button id="backBtn">
                            ← Back
                        </button>
                    </div>
                    <img id="ALevel" class="upright" src="ALevel.jpg">
                    `)
                    BackButton(certificates);
                })
                slicecorn.addEventListener("click", function(){
                    changeContent(`
                    <div style="text-align: right;">
                        <button id="backBtn">
                            ← Back
                        </button>
                    </div>
                    <img id="SliceCorn" class="landscape" src="slicecorn.jpg">
                    `)
                    BackButton(certificates);
                })
                codebegins.addEventListener("click", function(){
                    changeContent(`
                    <div style="text-align: right;">
                        <button id="backBtn">
                            ← Back
                        </button>
                    </div>
                    <img id="CodeBegins" class="landscape" src="codebegins.jpg">
                    `)
                    BackButton(certificates);
                })
                MLcet.addEventListener("click", function(){
                    changeContent(`
                    <div style="text-align: right;">
                        <button id="backBtn">
                            ← Back
                        </button>
                    </div>
                    <img id="MLCET" class="upright" src="MLcet.jpeg">
                    `)
                    BackButton(certificates);
                })

            });
            skills.addEventListener("click", function(){
                setActive(skills);
                changeContent(`
                <h2><u>Skills</u></h2>

                <div style="text-align: left;">

                    <p>Python</p>
                    <div class="skbar">
                        <div class="progress" style="width:90%;"></div>
                    </div>

                    <p>HTML</p>
                    <div class="skbar">
                        <div class="progress" style="width:90%;"></div>
                    </div>

                    <p>CSS</p>
                    <div class="skbar">
                        <div class="progress" style="width:90%;"></div>
                    </div>

                    <p>JavaScript</p>
                    <div class="skbar">
                        <div class="progress" style="width:90%;"></div>
                    </div>

                    <p>C++</p>
                    <div class="skbar">
                        <div class="progress" style="width:80%;"></div>
                    </div>

                    <p>C</p>
                    <div class="skbar">
                        <div class="progress" style="width:70%;"></div>
                    </div>

                    <p>Java</p>
                    <div class="skbar">
                        <div class="progress" style="width:40%;"></div>
                    </div>

                    <p>SQL</p>
                    <div class="skbar">
                        <div class="progress" style="width:30%;"></div>
                    </div>

                </div>
                `);

            });
            projects.addEventListener("click", function(){
                setActive(projects);
                changeContent(`
                <h2>Projects</h2>
                <div id="projectsContainer">

                    <div class="procard" id="calculatorCard">
                
                        <h3>Calculator Application</h3>
                
                        <p>Developed during the Code Begins competition organized by MVN University.</p>
                        <p>🥉 Bronze Medal</p>
                        <p>Click to view more details</p>
                    </div>

                    <div class="procard">

                        <h3>Future Project</h3>
                        <p> Coming soon...</p>
                        <p> 🚀 In Development </p>
                    </div>
                </div>    
                `)
                let calculatorCard = document.getElementById("calculatorCard");
                calculatorCard.addEventListener("click", function(){
                    changeContent(`
                    <div style="text-align: right;">
                        <button id="backBtn">
                            ← Back
                        </button>
                    </div>
                    <div style="text-align: center;">
                    <h1>Calculator Application</h1>

                    <p>This calculator was developed for the Code Begins Programming Competition organized by MVN University.</p>
                    
                    <h2>Technologies Used:</h2>
                        <p>C Programming</p>
                        <p>Logic Building</p>
                        <p>User Input Handling</p>

                    <p> <h2>Achievement:</h2> Bronze Medal 🥉 </p>
                    </div>
                    `);
                    BackButton(projects);
                });
            });
            contact.addEventListener("click", function(){
                setActive(contact);
                changeContent(`
                <h2 style="text-align:center;">Contact Me</h2>
                <div class="contactCard">
                    <h3>📧 Email</h3>
                    <a href="mailto:sitachapeh@gmail.com">sitachapeh@gmail.com</a>
                </div>

                <div class="contactCard">
                    <h3>💼 LinkedIn</h3>
                    <a href="https://www.linkedin.com/in/nigel-njini-chapwanya-5bb782338">View Profile</a>
                </div>
                
                <div class="contactCard">
                    <h3>📱 Phone</h3>
                    <a href="https://wa.me/qr/KT5JNRQFO7PXJ1">+918570940576</a>
                </div>
                `)
            });
            floatingMenu.addEventListener("mouseenter", function(){
                sidebar.style.left = "0px";
                backdrop.style.display = "block";
                floatingMenu.style.display = "none";
            });
            sidebar.addEventListener("mouseleave", function(){
                sidebar.style.left = "-300px";
                backdrop.style.display = "none";
                floatingMenu.style.display = "block";
            });
        </script>
    </body>
</html>
